
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// ------------------------------------
// Environment files for react-native-config
// ------------------------------------
project.ext.envConfigFiles = [
    debug       : ".env",
    release     : ".env",
    devDebug    : ".env",
    devRelease  : ".env",
    uatDebug    : ".env",
    uatRelease  : ".env",
    prodDebug   : ".env",
    prodRelease : ".env"
]

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// ------------------------------------
// Windows Node path configuration
// ------------------------------------
project.ext.react = [
    nodeExecutableAndArgs: ["C:/Program Files/nodejs/node.exe"],
    REACT_NATIVE_NODE_MODULES_DIR:
        "C:/Users/HP/Documents/CoinMob/node_modules/react-native",
    REACT_NATIVE_WORKLETS_NODE_MODULES_DIR:
        "C:/Users/HP/Documents/CoinMob/node_modules/react-native-worklets"
]

// ------------------------------------
// React Native configuration
// ------------------------------------
react {
    autolinkLibrariesWithApp()
}

// ------------------------------------
// Release code optimisation
// ------------------------------------
def enableProguardInReleaseBuilds = true

def jscFlavor =
    'io.github.react-native-community:jsc-android:2026004.+'

// ------------------------------------
// Automatic versioning from package.json
// ------------------------------------
def packageJson = new File(rootDir, "../package.json")

if (!packageJson.exists()) {
    throw new GradleException(
        "package.json not found at: ${packageJson.absolutePath}"
    )
}

def versionMatcher =
    packageJson.text =~ /"version"\s*:\s*"([^"]+)"/

if (!versionMatcher.find()) {
    throw new GradleException(
        "Unable to read version from package.json"
    )
}

def appVersionName = versionMatcher.group(1)

// Example: 0.0.6 becomes versionCode 6.
// Example: 1.2.3 becomes versionCode 123.
def appVersionCode = appVersionName.replace(".", "").toInteger()

// ------------------------------------
// Android configuration
// ------------------------------------
android {
    buildFeatures {
        buildConfig true
    }

    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    namespace "zm.co.znbs.mlis"

    defaultConfig {
        applicationId "zm.co.znbs.mlis"

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode appVersionCode
        versionName appVersionName

        resValue(
            "string",
            "build_config_package",
            "zm.co.znbs.mlis"
        )
    }

    // ------------------------------------
    // Environment flavors
    // ------------------------------------
    flavorDimensions "environment"

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"

            resValue "string", "app_name", "ZNBS DEV"
        }

        uat {
            dimension "environment"
            applicationIdSuffix ".uat"

            resValue "string", "app_name", "ZNBS MLIS UAT"
        }

        prod {
            dimension "environment"

            resValue "string", "app_name", "ZNBS Instant Loan"
        }
    }

    // ------------------------------------
    // Signing configurations
    // ------------------------------------
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            storeFile file("coinmob-release.keystore")
            storePassword "Coinmob@2026"
            keyAlias "coinmob"
            keyPassword "Coinmob@2026"
        }
    }

    // ------------------------------------
    // Build types
    // ------------------------------------
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release

            // Enable R8 shrinking and obfuscation.
            minifyEnabled enableProguardInReleaseBuilds

            // Optimised default Android ProGuard rules
            // plus your app-specific rules.
            proguardFiles(
                getDefaultProguardFile(
                    "proguard-android-optimize.txt"
                ),
                "proguard-rules.pro"
            )
        }
    }

    // ------------------------------------
    // APK ABI splits
    // These settings primarily affect APK outputs.
    // ------------------------------------
    splits {
        abi {
            enable true
            reset()

            include "armeabi-v7a", "arm64-v8a"

            universalApk true
        }
    }
}

// ------------------------------------
// Dependencies
// ------------------------------------
dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
